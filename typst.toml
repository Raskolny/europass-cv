[package]
name = "rasko-europass"
version = "1.0.0"
entrypoint = "lib.typ"
# NOTE: do NOT add a `thumbnail` key here — the current typst/packages bundler
# rejects unknown manifest fields.  The thumbnail.png FILE is included in the
# package and picked up by convention instead.
authors = ["rasko-- <raskolny@gmail.com>"]
license = "MIT"
description = "A faithful, accessible reproduction of the official EU Europass CV: asymmetric two-column grid, EU blue palette, CEFR language self-assessment table, GDPR clause and full 24-language i18n."
repository = "https://github.com/Raskolny/europass-cv"
keywords = ["cv", "resume", "curriculum-vitae", "europass", "europe", "accessible", "pdf-ua", "i18n"]
categories = ["cv"]
compiler = "0.15.0"
# Universe policy forbids shipping font binaries in a package, so `fonts` is
# excluded from the bundle: the vendored Open Sans family serves repository
# builds only (hermetic, --ignore-system-fonts), while Universe users install
# Open Sans themselves or pass `font:`.  `social-preview.typ` is the dev-only
# generator for the GitHub Open-Graph card and must not ship either.
exclude = ["output.pdf", "build.sh", "build-examples.sh", "verify.sh", "examples/pdf", ".github", "fonts", "social-preview.typ"]
