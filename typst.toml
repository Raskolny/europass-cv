[package]
name = "rasko-europass"
version = "1.0.0"
entrypoint = "lib.typ"
# NOTE: `thumbnail` is only valid inside a `[template]` table; unknown fields
# in `[package]` are rejected by the typst/packages bundler.  The Universe
# submission (typst/packages#5905) declares `[template]` with
# template/main.typ; this development manifest stays flat until the repo
# adopts the same structure for 1.1.0 (see ROADMAP.md).
authors = ["rasko-- <raskolny@gmail.com>"]
license = "MIT"
description = "Accessible, faithful Europass CV with CEFR language grid, PDF/UA-1 output and 24 EU languages."
repository = "https://github.com/Raskolny/europass-cv"
keywords = ["cv", "resume", "curriculum-vitae", "europass", "europe", "accessible", "pdf-ua", "i18n"]
categories = ["cv"]
compiler = "0.15.0"
# Universe policy forbids shipping font binaries in a package, so `fonts` is
# excluded from the bundle: the vendored Open Sans family serves repository
# builds only (hermetic, --ignore-system-fonts), while Universe users install
# Open Sans themselves or pass `font:`.  `social-preview.typ` is the dev-only
# generator for the GitHub Open-Graph card and `social-preview.png` its
# dev-only output; neither ships.  `sync-universe.sh` is the drift guard that
# keeps the typst/packages submission in step with the release tag.
exclude = ["output.pdf", "build.sh", "build-examples.sh", "verify.sh", "sync-universe.sh", "examples/pdf", ".github", "fonts", "social-preview.typ", "social-preview.png"]
