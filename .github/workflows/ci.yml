---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    name: Hermetic PDF/UA-1 build + accessibility & font verification
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: "0.15.0"
      TYPSTYLE_VERSION: "0.15.1"
    steps:
      # checkout v4.2.2, pinned by commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poppler (pdffonts) and PyMuPDF (tag-tree inspection)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 -m pip install --quiet --user --break-system-packages pymupdf

      - name: Install Typst CLI
        run: |
          # NOTE: Typst release assets are .tar.xz (not .tar.gz); curl -f makes
          # a wrong URL fail loudly instead of downloading a 404 body.
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          mkdir -p "$HOME/.local/bin"
          cp typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          typst --version

      - name: Install typstyle (pinned canonical formatter)
        run: |
          # typstyle ships BARE release binaries (no .tar.xz archive like
          # Typst), so the executable is downloaded directly; curl -f makes a
          # wrong URL fail loudly.  Pinned because typstyle's output can change
          # between versions and this version has no config file to pin
          # instead (see CONTRIBUTING.md "Code style").
          curl -fsSL -o "$HOME/.local/bin/typstyle" \
            "https://github.com/Enter-tainer/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-musl"
          chmod +x "$HOME/.local/bin/typstyle"
          typstyle --version

      - name: Check canonical formatting (typstyle --check)
        run: |
          # A gate that REPORTS, never rewrites: a contributor whose code needs
          # reformatting sees this step fail with the diff and can fix locally
          # or ask a maintainer.  Nobody is required to install anything.
          typstyle --check lib.typ main.typ social-preview.typ examples/*.typ

      - name: Build main CV (hermetic fonts, PDF/UA-1) and verify
        run: ./build.sh

      - name: Build all 24 language examples (PDF/UA-1)
        run: ./build-examples.sh "${RUNNER_TEMP}/examples-pdf"
